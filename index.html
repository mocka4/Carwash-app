<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShineBay Carwash OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjovLkyOhQgRNaHrtFYlNrzJAeFfAheqQ",
            authDomain: "carwash-business-4b3e1.firebaseapp.com",
            projectId: "carwash-business-4b3e1",
            storageBucket: "carwash-business-4b3e1.firebasestorage.app",
            messagingSenderId: "171062055560",
            appId: "1:171062055560:web:173b19ad08c81a035d453d"
        };

        window.app = initializeApp(firebaseConfig);
        window.auth = getAuth(window.app);
        window.db = getFirestore(window.app);
        window.FirebaseSDKs = { signInAnonymously, doc, setDoc, onSnapshot, collection, addDoc, deleteDoc, updateDoc };

        signInAnonymously(window.auth).then(() => {
            console.log("ShineBay Firebase Connected");
            window.isFirebaseActive = true;
            const badge = document.getElementById('sync-status');
            if(badge) {
                badge.innerText = "🟢 Synced Live";
                badge.className = "px-3 py-1 bg-green-900 text-green-200 border border-green-700 rounded-full text-xs font-bold";
            }
        }).catch(err => {
            console.warn("Using Local Fallback Mode:", err);
            const badge = document.getElementById('sync-status');
            if(badge) {
                badge.innerText = "🟡 Local Storage Mode";
                badge.className = "px-3 py-1 bg-amber-900 text-amber-200 border border-amber-700 rounded-full text-xs font-bold";
            }
        });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 class="text-xl font-black text-cyan-400 tracking-wider">SHINEBAY OS</h1>
            <p class="text-xs text-slate-400">South African Carwash Management</p>
        </div>
        <div id="sync-status" class="px-3 py-1 bg-slate-800 text-slate-300 border border-slate-700 rounded-full text-xs font-bold animate-pulse">Connecting...</div>
    </header>

    <!-- Main Container -->
    <main class="p-4 max-w-md mx-auto space-y-4">
        <!-- Partner Sync Box -->
        <section class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-xl">
            <h2 class="text-sm font-bold mb-3 text-cyan-300 uppercase tracking-wide">Partner Sync Setup</h2>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Shop Code</label>
                    <input id="input-shop-code" type="text" value="SHINE-2026" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono text-sm uppercase">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Your Name</label>
                    <input id="input-user-name" type="text" placeholder="e.g. Partner" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white">
                </div>
            </div>
        </section>

        <!-- Quick Stats -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400">Today's Revenue</span>
                <p id="stat-revenue" class="text-2xl font-black text-emerald-400 mt-1">R0.00</p>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400">Active Wash Tickets</span>
                <p id="stat-tickets" class="text-2xl font-black text-cyan-400 mt-1">0</p>
            </div>
        </section>

        <!-- Add Wash Ticket Form -->
        <section class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-xl">
            <h2 class="text-sm font-bold mb-3 text-cyan-300 uppercase tracking-wide">New Wash Ticket</h2>
            <form id="ticket-form" class="space-y-3" onsubmit="event.preventDefault(); addTicket();">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Vehicle Registration / Model</label>
                    <input id="car-desc" type="text" placeholder="e.g. CA 123-456 / VW Polo" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Service Type & Price (ZAR)</label>
                    <select id="wash-package" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white">
                        <option value="Standard Wash - R80">Standard Wash — R80</option>
                        <option value="Full House Wash & Vacuum - R150">Full House Wash & Vacuum — R150</option>
                        <option value="Executive Valet - R350">Executive Valet — R350</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-2 rounded-lg transition text-sm shadow-lg">
                    Add Wash Ticket
                </button>
            </form>
        </section>

        <!-- Live Tickets Feed -->
        <section class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-xl">
            <h2 class="text-sm font-bold mb-3 text-cyan-300 uppercase tracking-wide">Live Wash Queue</h2>
            <div id="tickets-container" class="space-y-2">
                <p class="text-xs text-slate-500 text-center py-4">No active tickets yet. Add one above!</p>
            </div>
        </section>
    </main>

    <script>
        // Local state fallback & core interaction logic
        let tickets = JSON.parse(localStorage.getItem('shinebay_tickets') || '[]');

        function renderTickets() {
            const container = document.getElementById('tickets-container');
            const statRevenue = document.getElementById('stat-revenue');
            const statTickets = document.getElementById('stat-tickets');
            
            if (tickets.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">No active tickets yet. Add one above!</p>';
                statRevenue.innerText = 'R0.00';
                statTickets.innerText = '0';
                return;
            }

            let totalRev = 0;
            container.innerHTML = '';
            tickets.forEach((t, idx) => {
                const priceMatch = t.package.match(/R(\d+)/);
                const price = priceMatch ? parseInt(priceMatch[1]) : 0;
                totalRev += price;

                const div = document.createElement('div');
                div.className = "bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-sm text-white">${t.car}</p>
                        <p class="text-xs text-slate-400">${t.package} • <span class="text-cyan-400">${t.staff || 'Staff'}</span></p>
                    </div>
                    <button onclick="removeTicket(${idx})" class="text-xs bg-rose-950 text-rose-300 px-2 py-1 rounded border border-rose-800">Done</button>
                `;
                container.appendChild(div);
            });

            statRevenue.innerText = 'R' + totalRev.toLocaleString();
            statTickets.innerText = tickets.length;
        }

        function addTicket() {
            const car = document.getElementById('car-desc').value;
            const pkg = document.getElementById('wash-package').value;
            const staff = document.getElementById('input-user-name').value || 'Partner';

            const newTicket = { car, package: pkg, staff, timestamp: Date.now() };
            tickets.unshift(newTicket);
            localStorage.setItem('shinebay_tickets', JSON.stringify(tickets));
            
            document.getElementById('car-desc').value = '';
            renderTickets();
        }

        function removeTicket(idx) {
            tickets.splice(idx, 1);
            localStorage.setItem('shinebay_tickets', JSON.stringify(tickets));
            renderTickets();
        }

        renderTickets();
    </script>
</body>
</html>
